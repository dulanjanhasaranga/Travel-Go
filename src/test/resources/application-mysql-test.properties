spring.config.import=
# Isolate account cooldown workflows from process-wide real-time HTTP budgets.
# Dedicated AuthenticationAbuseIntegrationTests separately verify enabled limits.
travelgo.security.auth-abuse.enabled=false
# Enabled-mail tests replace the transport; never use an external SMTP provider.
spring.mail.host=127.0.0.1
spring.mail.port=25252
travelgo.mail.from=tests@travelgo.test
spring.datasource.url=jdbc:mysql://127.0.0.1:33317/travelgo_disposable_test?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TRAVELGO_TEST_DB_USERNAME:root}
spring.datasource.password=${TRAVELGO_TEST_DB_PASSWORD:}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
travelgo.upload-directory=target/test-uploads
