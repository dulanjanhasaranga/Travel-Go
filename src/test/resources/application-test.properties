spring.config.import=
# Workflow fixtures reuse synthetic IPs and advance the business clock.
# Dedicated AuthenticationAbuseIntegrationTests explicitly enable real-time limits.
travelgo.security.auth-abuse.enabled=false
spring.datasource.url=jdbc:h2:mem:travelgo-test;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
travelgo.upload-directory=target/test-uploads
spring.thymeleaf.cache=false
# Enabled-mail tests replace the transport; these loopback-only values satisfy configuration validation.
spring.mail.host=127.0.0.1
spring.mail.port=25252
travelgo.mail.from=tests@travelgo.test
travelgo.mail.account-retry-enabled=false
