# Isolated demonstration on the local verification server, NOT the real travelgo database.
# Uses the normal application/JAR, with persistent tables (no create-drop).
spring.datasource.url=jdbc:mysql://127.0.0.1:33317/travelgo_persistence_demo?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
server.address=127.0.0.1
server.port=8083
travelgo.mail.enabled=false
travelgo.mail.dispatch-enabled=false
travelgo.public-base-url=http://127.0.0.1:8083
