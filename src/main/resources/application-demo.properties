# Local university demonstration only. Both this profile AND the flag are required.
# Keep mysql active too: --spring.profiles.active=mysql,demo --travelgo.demo.enabled=true
travelgo.demo.enabled=true
# Demonstration records must not send external email by default.
travelgo.mail.enabled=false
travelgo.mail.dispatch-enabled=false
# Demo shortcuts must only be reachable from the machine running the preview.
server.address=127.0.0.1
