<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><body style="margin:0;background:#f1f5f9;font-family:Arial,sans-serif;color:#243247"><table role="presentation" style="width:100%;max-width:640px;margin:auto;background:#fff;border-collapse:collapse"><tr><td style="background:#0f172a;padding:28px;color:white"><img src="cid:travelgo-logo" width="72" height="72" alt="TravelGO" style="display:block;object-fit:contain;margin-bottom:12px"><strong style="font-size:26px">TravelGO</strong><p>Your travel, thoughtfully organised.</p></td></tr><tr><td style="padding:28px"><h1 style="font-size:24px" th:text="${heading}"></h1><p th:text="${'Hello ' + customerName + ','}"></p><p th:text="${intro}"></p><table style="width:100%;border-collapse:collapse"><tr th:each="row : ${details}"><th style="padding:10px 0;text-align:left;border-bottom:1px solid #e2e8f0" th:text="${row.key}"></th><td style="padding:10px;text-align:right;border-bottom:1px solid #e2e8f0" th:text="${row.value}"></td></tr></table><h2 style="font-size:18px">What happens next</h2><p th:text="${nextStep}"></p><p th:if="${link != null}"><a th:href="${link}" style="color:#216fbe">View details in TravelGO</a></p><p style="font-size:13px;color:#64748b">Payments in this application are simulated. This message does not constitute a supplier reservation or a visa grant.</p></td></tr><tr><td style="padding:24px;background:#eaf1f8"><strong>TravelGO travel team</strong><p th:text="${contact}"></p></td></tr></table></body></html>
