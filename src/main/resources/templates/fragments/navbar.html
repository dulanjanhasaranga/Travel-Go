<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
    <header th:fragment="navbar" class="navbar">
        <div class="container nav-container">
            <!-- Brand Logo -->
            <a th:href="@{/}" class="brand-logo">
                <span class="official-mark"><img th:src="@{/images/travelgo-logo.png}" alt="" width="100" height="100"></span>
                Travel<span>GO</span>
            </a>

            <button type="button" class="nav-toggle btn btn-outline" aria-expanded="false" aria-controls="primary-navigation">Menu</button>
            <!-- Navigation Links -->
            <ul class="nav-links" id="primary-navigation">
                <li><a th:href="@{/}" class="nav-link">Home</a></li>
                <li><a th:href="@{/destinations}" class="nav-link">Destinations</a></li>
                <li><a th:href="@{/packages}" class="nav-link">Tour Packages</a></li>
                <li><a th:href="@{/visa-info}" class="nav-link">Visa Guide</a></li>
                <li><a th:href="@{/about}" class="nav-link">About</a></li>
                <li><a th:href="@{/contact}" class="nav-link">Contact</a></li>
                <li><a th:href="@{/faq}" class="nav-link">FAQ</a></li>
            </ul>

            <!-- Navigation Actions / Authentication State -->
            <div class="nav-actions">
                <div th:replace="~{fragments/notification-bell :: bell}"></div>
                <!-- If Not Authenticated -->
                <div sec:authorize="!isAuthenticated()" style="display: flex; gap: 0.65rem;">
                    <a th:href="@{/auth/login}" class="btn btn-outline btn-sm">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1" />
                        </svg>
                        Sign In
                    </a>
                    <a th:href="@{/auth/register}" class="btn btn-secondary btn-sm">
                        Create Account
                    </a>
                </div>

                <!-- If Authenticated as Admin -->
                <div sec:authorize="hasRole('ADMIN')" style="display: flex; gap: 0.65rem; align-items: center;">
                    <a th:href="@{/admin/dashboard}" class="btn btn-primary btn-sm">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z" />
                        </svg>
                        Admin Workspace
                    </a>
                    <form th:action="@{/auth/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-ghost btn-sm" title="Sign Out">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                        </button>
                    </form>
                </div>

                <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/customer/profile}" class="nav-link">My profile</a>
                <!-- If Authenticated as Customer -->
                <div sec:authorize="hasRole('CUSTOMER')" style="display: flex; gap: 0.65rem; align-items: center;">
                    <a th:href="@{/customer/dashboard}" class="btn btn-accent btn-sm">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                        </svg>
                        My Dashboard
                    </a>
                    <form th:action="@{/auth/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-ghost btn-sm" title="Sign Out">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                        </button>
                    </form>
                </div>

                <!-- If Authenticated as Staff -->
                <div sec:authorize="hasAnyRole('TRAVEL_CONSULTANT', 'VISA_OFFICER')" style="display: flex; gap: 0.65rem; align-items: center;">
                    <a th:href="@{/staff/dashboard}" class="btn btn-primary btn-sm">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        Staff Portal
                    </a>
                    <form th:action="@{/auth/logout}" method="post" style="display: inline;">
                        <button type="submit" class="btn btn-ghost btn-sm" title="Sign Out">
                            <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                            </svg>
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </header>
</body>
</html>
