<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head><body>
<header th:fragment="navbar" class="navbar">
 <div class="container nav-container">
  <a th:href="@{/}" class="brand-logo" th:attr="aria-label=${(systemSettings != null and !#strings.isEmpty(systemSettings.companyName) ? systemSettings.companyName : 'TravelGO') + ' home'}"><span class="official-mark"><img th:with="agencyLogo=${@travelImages.logo(systemSettings != null ? systemSettings.logoUrl : null)}" th:src="${agencyLogo == '/images/travelgo-logo.png' ? '/images/brand/travelgo-airborne.png' : agencyLogo}" th:srcset="${agencyLogo == '/images/travelgo-logo.png' or agencyLogo == '/images/brand/travelgo-airborne.png' ? '/images/brand/travelgo-airborne-192.webp 192w, /images/brand/travelgo-airborne-384.webp 384w' : null}" sizes="(max-width: 600px) 105px, 145px" th:classappend="${agencyLogo != '/images/travelgo-logo.png' ? 'agency-logo-custom' : null}" data-image-fallback="brand" alt="" width="100" height="100"></span><span class="brand-wordmark" th:text="${systemSettings != null and !#strings.isEmpty(systemSettings.companyName) ? systemSettings.companyName : 'TravelGO'}">TravelGO</span></a>
  <button type="button" class="nav-toggle nav-control" aria-label="Open navigation" aria-expanded="false" aria-controls="site-navigation-panel"><span class="nav-toggle-label">Menu</span><svg class="nav-toggle-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path class="nav-toggle-line nav-toggle-line-top" stroke-linecap="round" d="M3 8h18"/><path class="nav-toggle-line nav-toggle-line-bottom" stroke-linecap="round" d="M3 16h18"/></svg></button>
  <div id="site-navigation-panel" class="nav-panel" tabindex="-1">
  <div class="nav-panel-heading"><div><p class="nav-panel-eyebrow">Discover more</p><h2 id="site-navigation-title">Your next journey.</h2></div><button type="button" class="nav-close" data-nav-dismiss aria-label="Close navigation"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" d="m6 6 12 12M18 6 6 18"/></svg></button></div>
  <nav id="primary-navigation" class="nav-links" aria-label="Main navigation">
   <a th:href="@{/}" class="nav-link">Home</a><a th:href="@{/destinations}" class="nav-link">Destinations</a><a th:href="@{/packages}" class="nav-link">Tour Packages</a><a th:href="@{/visa-info}" class="nav-link">Visa Guide</a><a th:href="@{/about}" class="nav-link">About</a><a th:href="@{/contact}" class="nav-link">Contact</a><a th:href="@{/faq}" class="nav-link">FAQ</a>
  </nav>
  <div class="nav-actions" aria-label="Account controls">
   
   <div th:replace="~{fragments/notification-bell :: bell}"></div>
   <div sec:authorize="!isAuthenticated()" class="nav-auth-actions"><a th:href="@{/auth/login}" class="nav-control">Sign in</a><a th:href="@{/auth/register}" class="nav-control nav-control-primary">Create account</a></div>
   <details sec:authorize="isAuthenticated()" class="account-menu">
    <summary class="nav-control account-toggle" aria-label="My account"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="3.5"/><path stroke-linecap="round" d="M5 21v-2a7 7 0 0114 0v2"/></svg><span>My account</span><svg class="account-chevron" aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="m6 9 6 6 6-6"/></svg></summary>
    <div class="account-popover" aria-label="Account navigation">
     <p class="account-menu-heading">Your account</p>
     <div sec:authorize="hasRole('CUSTOMER')" class="account-menu-links"><a th:href="@{/customer/dashboard}">Dashboard</a><a th:href="@{/customer/bookings}">My bookings</a><a th:href="@{/customer/visas}">Visa applications</a><a th:href="@{/customer/inquiries}">My inquiries</a><a th:href="@{/customer/notifications}">Notifications</a><a th:href="@{/customer/profile}">Profile</a></div>
     <div sec:authorize="hasRole('ADMIN')" class="account-menu-links"><a th:href="@{/admin/dashboard}">Admin dashboard</a></div>
     <div sec:authorize="hasAnyRole('TRAVEL_CONSULTANT','VISA_OFFICER')" class="account-menu-links"><a th:href="@{/staff/dashboard}">Staff dashboard</a></div>
     <form th:action="@{/auth/logout}" method="post" class="account-signout"><button type="submit">Sign out</button></form>
    </div>
   </details>
  </div>
  </div>
  <button type="button" class="nav-backdrop" data-nav-dismiss aria-label="Close navigation" aria-hidden="true" tabindex="-1" hidden></button>
 </div>
</header>
</body></html>
