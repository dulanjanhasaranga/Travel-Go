<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
    <aside th:fragment="admin-sidebar(activeTab)" class="admin-sidebar">
        <div class="sidebar-header">
            <a th:href="@{/admin/dashboard}" class="sidebar-logo">
                <span class="official-mark"><img th:src="@{/images/travelgo-logo.png}" alt="" width="100" height="100"></span>
                <span>TravelGO</span>
            </a>
            <span class="sidebar-logo-badge">ADMIN</span>
        </div>

        <div class="sidebar-section-title">Core Management</div>
        <ul class="sidebar-menu"><li class="sidebar-item"><a th:href="@{/admin/inquiries}"><svg aria-hidden="true" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M21 11a8 8 0 0 1-8 8H7l-4 3V5a3 3 0 0 1 3-3h7a8 8 0 0 1 8 9Z"/></svg><span>Travel inquiries</span></a></li>
            <li class="sidebar-item" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                <a th:href="@{/admin/dashboard}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'users'} ? 'active' : ''">
                <a th:href="@{/admin/users}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                    </svg>
                    <span>User Management</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'approvals'} ? 'active' : ''">
                <a th:href="@{/admin/approvals}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4" />
                    </svg>
                    <span>Approvals Queue</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'staff'} ? 'active' : ''">
                <a th:href="@{/admin/staff}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 13.255A23.931 23.931 0 0112 15c-3.183 0-6.22-.62-9-1.745M16 6V4a2 2 0 00-2-2h-4a2 2 0 00-2 2v2m4 6h.01M5 20h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                    </svg>
                    <span>Staff Directory</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-section-title">Access & Security</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'roles'} ? 'active' : ''">
                <a th:href="@{/admin/roles}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
                    </svg>
                    <span>Roles & Permissions</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'audit'} ? 'active' : ''">
                <a th:href="@{/admin/audit-logs}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    <span>Audit Logs</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'permissions'} ? 'active' : ''">
                <a th:href="@{/admin/permissions}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
                    </svg>
                    <span>All Permissions</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-section-title">Configuration</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'settings'} ? 'active' : ''">
                <a th:href="@{/admin/settings}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                    <span>System Settings</span>
                </a>
            </li>
            <li class="sidebar-item">
                <a th:href="@{/}" target="_blank">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    <span>View Public Site</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            <div class="sidebar-user-card">
                <div class="user-avatar">AD</div>
                <div class="user-info">
                    <div class="user-name">Administrator</div>
                    <div class="user-role-tag" th:text="${#authentication.name}">Signed-in account</div>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" class="btn btn-outline btn-sm" style="width: 100%; border-color: rgba(255,255,255,0.15); color: #cbd5e1 !important; justify-content: center;">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Sign Out
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
