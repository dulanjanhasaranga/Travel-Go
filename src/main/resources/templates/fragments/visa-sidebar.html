<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head></head>
<body>
    <aside th:fragment="visa-sidebar(activeTab)" class="admin-sidebar">
        <div class="sidebar-header">
            <a th:href="@{/staff/dashboard}" class="sidebar-logo">
                <span class="official-mark"><img th:with="agencyLogo=${@travelImages.logo(systemSettings != null ? systemSettings.logoUrl : null)}" th:src="${agencyLogo == '/images/travelgo-logo.png' ? '/images/brand/travelgo-airborne.png' : agencyLogo}" th:classappend="${agencyLogo != '/images/travelgo-logo.png' ? 'agency-logo-custom' : null}" data-image-fallback="brand" alt="" width="100" height="100"></span>
                <span th:text="${systemSettings != null and !#strings.isEmpty(systemSettings.companyName) ? systemSettings.companyName : 'TravelGO'}">TravelGO</span>
            </a>
            <span class="sidebar-logo-badge" style="background: linear-gradient(135deg, #0284C7 0%, #0369A1 100%);">Visa officer</span>
        </div>

        <div class="sidebar-section-title">Overview</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'dashboard'} ? 'active' : ''">
                <a th:attr="aria-current=${activeTab == 'dashboard' ? 'page' : null}" th:href="@{/staff/dashboard}">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                    </svg>
                    <span>Dashboard</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'visas'} ? 'active' : ''">
                <a th:attr="aria-current=${activeTab == 'visas' ? 'page' : null}" th:href="@{/staff/visas}" sec:authorize="hasAnyAuthority('PERM_VISA_VIEW','PERM_VISA_MANAGE')">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                    </svg>
                    <span>Visa processing</span>
                </a>
            </li>
        </ul>

        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'checklists'} ? 'active' : ''">
                <a th:attr="aria-current=${activeTab == 'checklists' ? 'page' : null}" th:href="@{/staff/visas/checklists}" sec:authorize="hasAnyAuthority('PERM_VISA_VIEW','PERM_VISA_MANAGE')">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 5h6m-6 7h6m-6 4h6M7 3h10a2 2 0 012 2v14a2 2 0 01-2 2H7a2 2 0 01-2-2V5a2 2 0 012-2z" /></svg>
                    <span>Document checklists</span>
                </a>
            </li>
        </ul>
        <div class="sidebar-section-title">Payments</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item" th:classappend="${activeTab == 'payments'} ? 'active' : ''">
                <a th:attr="aria-current=${activeTab == 'payments' ? 'page' : null}" th:href="@{/staff/payments}" sec:authorize="hasAnyAuthority('PERM_VISA_MANAGE','PERM_PAYMENT_VIEW','PERM_PAYMENT_MANAGE')">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z" />
                    </svg>
                    <span>Payments</span>
                </a>
            </li>
            <li class="sidebar-item" th:classappend="${activeTab == 'refunds'} ? 'active' : ''"><a th:attr="aria-current=${activeTab == 'refunds' ? 'page' : null}" th:href="@{/staff/payments/refund-settlements}" sec:authorize="hasAnyAuthority('PERM_VISA_MANAGE','PERM_PAYMENT_VIEW','PERM_PAYMENT_MANAGE')"><span>Pending refunds</span></a></li>
            <li class="sidebar-item" th:classappend="${activeTab == 'history'} ? 'active' : ''">
                <a th:attr="aria-current=${activeTab == 'history' ? 'page' : null}" th:href="@{/staff/payments(tab='history')}" sec:authorize="hasAnyAuthority('PERM_VISA_MANAGE','PERM_PAYMENT_VIEW','PERM_PAYMENT_MANAGE')">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01" />
                    </svg>
                    <span>Payment records</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-section-title">Navigation</div>
        <ul class="sidebar-menu">
            <li class="sidebar-item">
                <a th:href="@{/}" target="_blank">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                    <span>View public site</span>
                </a>
            </li>
        </ul>

        <div class="sidebar-footer">
            
            <div class="sidebar-user-card">
                <div class="user-avatar" style="background: linear-gradient(135deg, #0284C7, #0369A1);">VO</div>
                <div class="user-info">
                    <div class="user-name" th:text="${currentUser != null ? currentUser.name : 'Visa officer'}">Visa officer</div>
                    <div class="user-role-tag" th:text="${#authentication.name}">Signed-in account</div>
                </div>
            </div>
            <form th:action="@{/auth/logout}" method="post">
                <button type="submit" class="btn btn-outline btn-sm" style="width: 100%; border-color: rgba(255,255,255,0.15);  justify-content: center;">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                    </svg>
                    Sign out
                </button>
            </form>
        </div>
    </aside>
</body>
</html>
