<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head><th:block th:replace="~{fragments/site-head :: theme-init}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboard Staff Member - TravelGO Admin</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <link rel="icon" type="image/png" th:href="@{/images/brand/travelgo-airborne.png}">
<th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block></head>
<body class="agency-workspace">
    <div class="admin-layout">
        <div th:replace="~{fragments/admin-sidebar :: admin-sidebar('staff')}"></div>

        <div class="admin-main">
            <header class="admin-topbar">
                <div class="topbar-left">
                    <div>
                        <div class="topbar-breadcrumb">
                            <a th:href="@{/admin/staff}">Staff directory</a>
                            <span>/</span>
                            <span style="color: var(--text-heading); font-weight: 600;">New account</span>
                        </div>
                        <h1 class="topbar-title">Add staff account</h1>
                    </div>
                </div>

                <div class="topbar-right"><div th:replace="~{fragments/notification-bell :: bell}"></div>
                    <a th:href="@{/admin/staff}" class="btn btn-outline btn-sm">
                        <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                        </svg>
                        Back to staff list
                    </a>
                </div>
            </header>

            <div class="admin-content">
                <div th:if="${errorMessage}" class="alert alert-danger">
                    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                    <span th:text="${errorMessage}"></span>
                </div>

                <div class="card" style="max-width: 650px; margin: 0 auto;">
                    <div class="table-header">
                        <h4 style="margin: 0;">Staff account details</h4>
                        <span style="font-size: 0.82rem; color: var(--text-muted);">A second administrator must approve this account.</span>
                    </div>

                    <div class="card-body">
                        <form th:action="@{/admin/staff/create}" th:object="${staffRequest}" method="post"><fieldset class="permission-readonly-fields" th:disabled="${!#authorization.expression('hasAuthority(''PERM_STAFF_MANAGE'')')}">
                            <div class="form-group">
                                <label class="form-label" for="name">Full Name *</label>
                                <input type="text" th:field="*{name}" class="form-control" maxlength="100" required th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name') ? 'name-error' : null}">
                                <div id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="email">Official work email *</label>
                                <input type="email" th:field="*{email}" class="form-control" maxlength="150" required th:attr="aria-invalid=${#fields.hasErrors('email')},aria-describedby=${#fields.hasErrors('email') ? 'email-error' : null}">
                                <div id="email-error" class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="roleName">Role assignment *</label>
                                <select th:field="*{roleName}" class="form-control" required>
                                    <option value="" disabled selected>-- Select Staff Role --</option>
                                    <option th:each="r : ${roles}" th:value="${r.roleName}" th:text="${#strings.capitalize(#strings.toLowerCase(#strings.replace(r.roleName,'_',' ')))} + ' — ' + ${r.description}"></option>
                                </select>
                                <div class="field-error" th:if="${#fields.hasErrors('roleName')}" th:errors="*{roleName}"></div>
                                <div class="form-hint">Determines which staff features this account can use.</div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="password">Initial password *</label>
                                <input type="password" th:field="*{password}" class="form-control" minlength="12" maxlength="72" placeholder="12–72 characters" required autocomplete="new-password">
                                <div class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="phone">Contact phone</label>
                                <input type="tel" th:field="*{phone}" class="form-control" maxlength="20" autocomplete="tel">
                                <div class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></div>
                            </div>

                            <div class="form-group">
                                <label class="form-label" for="address">Office / branch address</label>
                                <textarea th:field="*{address}" class="form-control" maxlength="1000"></textarea>
                                <div class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                            </div>

                            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;" sec:authorize="hasAuthority('PERM_STAFF_MANAGE')">
                                <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z" />
                                </svg>
                                Request staff account
                            </button>
                        </fieldset></form>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=20261013-csp}"></script>
    <script th:attr="nonce=${cspNonce}" th:src="@{/js/admin.js}"></script>
</body>
</html>
