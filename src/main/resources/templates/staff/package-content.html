<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Package content — TravelGO</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"></head><body><div class="admin-layout"><div th:replace="~{fragments/consultant-sidebar :: consultant-sidebar('packages')}"></div><main class="admin-main"><header class="admin-topbar"><span class="muted">TravelGO workspace</span><div th:replace="~{fragments/notification-bell :: bell}"></div></header><div class="admin-content"><a th:href="@{/staff/packages}">← Package catalogue</a><h1 th:text="${pkg.name}"></h1><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><form class="surface stack" method="post" th:action="@{/staff/packages/{id}/content(id=${pkg.id})}"><label>Day-by-day itinerary<textarea class="form-control" name="itinerary" rows="9" maxlength="10000" th:text="${pkg.itinerary}"></textarea></label><label>Excluded services<textarea class="form-control" name="excludedServices" rows="4" maxlength="5000" th:text="${pkg.excludedServices}"></textarea></label><label>Who this trip suits<textarea class="form-control" name="travelerInformation" rows="4" maxlength="5000" th:text="${pkg.travelerInformation}"></textarea></label><label><input type="checkbox" name="active" value="true" th:checked="${pkg.active}"> Available for booking requests</label><p class="muted">This controls catalogue visibility. It does not represent supplier inventory or a guaranteed departure.</p><button class="btn btn-primary">Save package content</button></form></div></main></div><script th:src="@{/js/main.js}"></script></body></html>
