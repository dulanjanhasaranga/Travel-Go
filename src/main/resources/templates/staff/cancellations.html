<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/site-head :: theme-init}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cancellation requests — TravelGO</title><link rel="stylesheet" th:href="@{/css/base-style.bcd0223d626fcbe1.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="stylesheet" th:href="@{/css/agency-workflow.css}"><th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block></head><body class="agency-workspace"><div class="admin-layout"><div th:replace="~{fragments/consultant-sidebar :: consultant-sidebar('bookings')}"></div><main class="admin-main"><header class="admin-topbar"><h1 class="topbar-title">Cancellation requests</h1><div th:replace="~{fragments/notification-bell :: bell}"></div></header><div class="admin-content"><a th:href="@{/staff/bookings}">Back to bookings</a><p>Check supplier terms and obtain acceptance of the refund quote before cancelling the booking.</p><section class="workflow-card" th:each="request : ${requests}"><h2 th:text="${request.booking.tourPackage.name}"></h2><p th:text="${'Request #' + request.id + ' · Booking #' + request.booking.id + ' · ' + #strings.capitalize(#strings.toLowerCase(request.status))}"></p><p class="workflow-copy" th:text="${request.reason}"></p><a th:href="@{/staff/bookings/cancellations/{id}(id=${request.id})}" class="btn btn-outline">Review request</a></section><p th:if="${#lists.isEmpty(requests)}">No cancellation requests have been submitted.</p></div></main></div><script defer th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=a32e401bb4dd}"></script></body></html>
