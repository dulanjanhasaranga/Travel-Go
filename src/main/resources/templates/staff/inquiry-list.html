<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/site-head :: theme-init}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel inquiries — TravelGO</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="icon" th:href="@{/images/brand/travelgo-airborne.png}"><th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block><th:block th:if="${base == '/admin/inquiries'}"><th:block th:replace="~{fragments/admin-console :: console-styles}"></th:block></th:block></head><body class="agency-workspace" th:classappend="${base == '/admin/inquiries' ? 'admin-console' : ''}"><div class="admin-layout"><th:block th:if="${base == '/admin/inquiries'}"><div th:replace="~{fragments/admin-sidebar :: admin-sidebar('inquiries')}"></div></th:block><th:block th:if="${base == '/staff/inquiries'}"><div th:replace="~{fragments/consultant-sidebar :: consultant-sidebar('inquiries')}"></div></th:block><main class="admin-main"><th:block th:if="${base == '/admin/inquiries'}"><header th:replace="~{fragments/admin-console :: topbar('Customer operations', 'Travel inquiries')}"></header></th:block><header class="admin-topbar" th:unless="${base == '/admin/inquiries'}"><span class="muted">TravelGO workspace</span><div th:replace="~{fragments/notification-bell :: bell}"></div></header><div class="admin-content"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><span class="eyebrow">Customer communication</span><h1 th:unless="${base == '/admin/inquiries'}">Travel inquiries</h1><p>Review travel plans, record follow-up and reply to customers.</p><form method="get" th:action="${base}" class="portal-links"><label>Search <input class="form-control" name="search" th:value="${search}" placeholder="Reference, name or subject"></label><label>Status <select class="form-control" name="status"><option value="">All statuses</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option></select></label><button class="btn btn-primary">Filter inquiries</button></form><section class="surface"><p th:if="${#lists.isEmpty(inquiries)}">No inquiries match these filters.</p><table class="table" th:if="${!#lists.isEmpty(inquiries)}"><thead><tr><th>Reference</th><th>Customer</th><th>Travel plans</th><th>Received</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="i : ${inquiries}"><td th:text="${i.reference}"></td><td><strong th:text="${i.senderName}"></strong><p th:text="${i.subject}"></p></td><td th:text="${i.destination != null ? i.destination.city : 'To be discussed'}"></td><td th:text="${#temporals.format(i.createdAt,'dd MMM yyyy')}"></td><td><span class="badge" th:classappend="${i.statusLabel == 'New'} ? 'badge-info' : (${i.statusLabel == 'Resolved' or i.statusLabel == 'Replied'} ? 'badge-success' : 'badge-warning')" th:text="${i.statusLabel}"></span></td><td><a th:href="${base+'/'+i.id}">View inquiry →</a></td></tr></tbody></table></section></div></main></div><script th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=20261013-csp}"></script></body></html>
