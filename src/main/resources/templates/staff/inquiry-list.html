<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Travel inquiries — TravelGO</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/admin.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="icon" th:href="@{/images/travelgo-logo.png}"></head><body><div class="admin-layout"><th:block th:if="${base == '/admin/inquiries'}"><div th:replace="~{fragments/admin-sidebar :: admin-sidebar('inquiries')}"></div></th:block><th:block th:if="${base == '/staff/inquiries'}"><div th:replace="~{fragments/consultant-sidebar :: consultant-sidebar('inquiries')}"></div></th:block><main class="admin-main"><header class="admin-topbar"><span class="muted">TravelGO workspace</span><div th:replace="~{fragments/notification-bell :: bell}"></div></header><div class="admin-content"><div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div><div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div><span class="eyebrow">Customer communication</span><h1>Travel inquiries</h1><p>Review preferences, record follow-ups and keep the customer informed.</p><form method="get" th:action="${base}" class="portal-links"><label>Search <input class="form-control" name="search" th:value="${search}" placeholder="Reference, name or subject"></label><label>Status <select class="form-control" name="status"><option value="">All statuses</option><option th:each="s : ${statuses}" th:value="${s}" th:text="${s.displayName}" th:selected="${s == selectedStatus}"></option></select></label><button class="btn btn-primary">Filter inquiries</button></form><section class="surface"><p th:if="${#lists.isEmpty(inquiries)}">No inquiries match these filters.</p><table class="table" th:if="${!#lists.isEmpty(inquiries)}"><thead><tr><th>Reference</th><th>Customer</th><th>Travel plans</th><th>Received</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="i : ${inquiries}"><td th:text="${i.reference}"></td><td><strong th:text="${i.senderName}"></strong><p th:text="${i.subject}"></p></td><td th:text="${i.destination != null ? i.destination.city : 'To be discussed'}"></td><td th:text="${#temporals.format(i.createdAt,'dd MMM yyyy')}"></td><td><span class="badge badge-info" th:text="${i.statusLabel}"></span></td><td><a th:href="${base+'/'+i.id}">View inquiry →</a></td></tr></tbody></table></section></div></main></div><script th:src="@{/js/main.js}"></script></body></html>
