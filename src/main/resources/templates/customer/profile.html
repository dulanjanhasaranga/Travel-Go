<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <th:block th:replace="~{fragments/site-head :: theme-init}"></th:block>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My profile - TravelGO</title>
    <link rel="stylesheet" th:href="@{/css/base-style.bcd0223d626fcbe1.css}">
    <link rel="stylesheet" th:href="@{/css/brand.css}">
    <link rel="icon" th:href="@{/images/brand/travelgo-favicon-64.png}">
    <th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block>
    <link rel="stylesheet" th:href="@{/css/customer-theme.css}">
</head>
<body class="customer-workspace">
    <div th:replace="~{fragments/navbar :: navbar}"></div>
    <main class="container section">
        <nav class="breadcrumbs" aria-label="Breadcrumb">
            <a th:href="@{/customer/dashboard}">My dashboard</a><span aria-hidden="true">/</span><span aria-current="page">Profile</span>
        </nav>
        <div class="surface profile-surface">
            <h1>Personal details</h1>
            <p>Keep your contact details up to date. Passport and traveler details are collected separately for each booking.</p>
            <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
            <form th:action="@{/customer/profile}" method="post" th:object="${profileRequest}" class="stack">
                <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger" role="alert">
                    Check the highlighted fields and save your details again.
                </div>
                <div>
                    <label for="name">Full name</label>
                    <input id="name" th:field="*{name}" required maxlength="100" autocomplete="name" th:errorclass="is-invalid"
                           th:attr="aria-invalid=${#fields.hasErrors('name')},aria-describedby=${#fields.hasErrors('name') ? 'name-error' : null}">
                    <p id="name-error" class="field-error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></p>
                </div>
                <div>
                    <label for="phone">Phone number</label>
                    <input type="tel" id="phone" th:field="*{phone}" maxlength="20" autocomplete="tel" inputmode="tel" th:errorclass="is-invalid"
                           th:attr="aria-invalid=${#fields.hasErrors('phone')},aria-describedby=${#fields.hasErrors('phone') ? 'phone-error' : null}">
                    <p id="phone-error" class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></p>
                </div>
                <div>
                    <label for="address">Address</label>
                    <textarea id="address" th:field="*{address}" maxlength="1000" autocomplete="street-address" rows="3" th:errorclass="is-invalid"
                              th:attr="aria-invalid=${#fields.hasErrors('address')},aria-describedby=${#fields.hasErrors('address') ? 'address-error' : null}"></textarea>
                    <p id="address-error" class="field-error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></p>
                </div>
                <div class="profile-actions">
                    <button class="btn btn-primary" type="submit">Save details</button>
                    <a class="btn btn-outline" th:href="@{/customer/dashboard}">Return to dashboard</a>
                </div>
            </form>
        </div>
    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
    <script defer th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=a32e401bb4dd}"></script>
</body>
</html>
