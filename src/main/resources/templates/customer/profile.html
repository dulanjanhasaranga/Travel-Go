<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>My profile — TravelGO</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="icon" th:href="@{/images/travelgo-logo.png}"></head><body><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container section"><nav class="breadcrumbs" aria-label="Breadcrumb"><a th:href="@{/customer/dashboard}">My dashboard</a><span>/</span><span>Profile</span></nav><div class="surface profile-surface"><span class="eyebrow">Your account</span><h1>Personal details</h1><p>Keep your contact details up to date. Passport and traveler details are collected separately for each booking.</p><div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div><form th:action="@{/customer/profile}" method="post" th:object="${profileRequest}" class="stack"><div><label for="name">Full name</label><input id="name" th:field="*{name}" required maxlength="100" autocomplete="name"><p class="field-error" th:errors="*{name}"></p></div><div><label for="phone">Phone number</label><input id="phone" th:field="*{phone}" maxlength="20" autocomplete="tel"><p class="field-error" th:errors="*{phone}"></p></div><div><label for="address">Address</label><textarea id="address" th:field="*{address}" maxlength="1000" autocomplete="street-address" rows="3"></textarea><p class="field-error" th:errors="*{address}"></p></div><button class="btn btn-primary" type="submit">Save details</button><a th:href="@{/customer/dashboard}">Return to dashboard</a></form></div></main><div th:replace="~{fragments/footer :: footer}"></div><script th:src="@{/js/main.js}"></script></body></html>
