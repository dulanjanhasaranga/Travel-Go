<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/site-head :: theme-init}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account recovery — TravelGO</title><link rel="stylesheet" th:href="@{/css/style.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="icon" th:href="@{/images/brand/travelgo-airborne.png}"><th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block></head><body class="auth-site journey-site"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container section"><section class="surface profile-surface"><h1>Forgot your password?</h1><p>Enter your account email to request a reset link. Links expire after 30 minutes and work once.</p><div th:if="${!recoveryConfigured}" class="alert alert-warning">Password recovery is currently unavailable. Contact our travel team for account assistance.</div><form th:if="${recoveryConfigured}" th:action="@{/auth/forgot-password}" method="post" class="stack"><label for="email">Email address</label><input id="email" type="email" name="email" maxlength="150" autocomplete="email" required><button class="btn btn-primary" type="submit">Send reset link</button></form><div th:if="${errorMessage}" role="alert" class="alert alert-danger" th:text="${errorMessage}"></div><div th:if="${successMessage}" role="status" class="alert alert-success" th:text="${successMessage}"></div><p><a th:href="@{/auth/login}">Back to sign in</a> · <a th:href="@{/contact}">Contact our team</a></p></section></main><div th:replace="~{fragments/footer :: footer}"></div><script th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=20261013-csp}"></script></body></html>
