<!DOCTYPE html><html lang="en" xmlns:th="http://www.thymeleaf.org"><head><th:block th:replace="~{fragments/site-head :: theme-init}"></th:block><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>Account recovery — TravelGO</title><link rel="stylesheet" th:href="@{/css/base-style.bcd0223d626fcbe1.css}"><link rel="stylesheet" th:href="@{/css/brand.css}"><link rel="icon" th:href="@{/images/brand/travelgo-favicon-64.png}"><th:block th:replace="~{fragments/site-head :: navigation-styles}"></th:block></head><body class="auth-site journey-site"><div th:replace="~{fragments/navbar :: navbar}"></div><main class="container section"><section class="surface profile-surface"><h1>Choose a new password</h1><p>Use 12–72 characters. Choose a password you do not use for another account.</p><form th:if="${token != null}" th:action="@{/auth/reset-password}" method="post" class="stack"><input type="hidden" name="token" th:value="${token}"><label for="password">New password</label><input id="password" type="password" name="password" minlength="12" maxlength="72" required autocomplete="new-password"><label for="confirmPassword">Confirm new password</label><input id="confirmPassword" type="password" name="confirmPassword" minlength="12" maxlength="72" required autocomplete="new-password"><button class="btn btn-primary" type="submit">Reset password</button></form><p th:if="${token == null}">Open the link from your recovery email, or <a th:href="@{/auth/forgot-password}">request a new link</a>.</p><div th:if="${errorMessage}" role="alert" class="alert alert-danger" th:text="${errorMessage}"></div><div th:if="${successMessage}" role="status" class="alert alert-success" th:text="${successMessage}"></div><p><a th:href="@{/auth/login}">Back to sign in</a> · <a th:href="@{/contact}">Contact our team</a></p></section></main><div th:replace="~{fragments/footer :: footer}"></div><script defer th:attr="nonce=${cspNonce}" th:src="@{/js/main.js?v=a32e401bb4dd}"></script></body></html>
