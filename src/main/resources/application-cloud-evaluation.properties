# Separate no-cost hosted academic demonstration. It is never the production profile.
# It accepts fictional data only and fails before external access unless every required
# Render secret and provider setting is present. See docs/FREE_CLOUD_RENDER_RELEASE.md.

spring.datasource.url=${TRAVELGO_DB_URL:}
spring.datasource.username=${TRAVELGO_DB_USERNAME:}
spring.datasource.password=${TRAVELGO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
# Compatibility with the existing 44-table cloud schema; no DDL is permitted.
spring.jpa.mapping-resources=META-INF/cloud-evaluation-orm.xml
spring.sql.init.mode=never
travelgo.data-initializer.enabled=false
travelgo.demo.enabled=false

# Render routes HTTPS to this fixed in-container TravelGO port.
server.address=0.0.0.0
server.port=8081
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/tmp/travelgo-aiven/truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TRAVELGO_DB_TRUSTSTORE_PASSWORD:}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false

server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
spring.thymeleaf.cache=true

# Host logs are the only logs: Render's free disk is ephemeral.
logging.file.name=
logging.logback.rollingpolicy.file-name-pattern=

# Exact, non-secret operator acknowledgement required at every hosted demo start.
travelgo.cloud-evaluation.release-acceptance=${TRAVELGO_CLOUD_EVALUATION_ACCEPTANCE:}

# No real payment, OAuth, supplier, catalogue, or account-provisioning paths.
travelgo.payments.simulated=true
travelgo.stripe.enabled=false
travelgo.payhere.enabled=false
travelgo.auth.google.enabled=false
travelgo.bookings.require-published-policy=true
travelgo.bookings.require-supplier-confirmation=true
travelgo.catalogue.install=false
travelgo.catalogue.restore-original=false

# Transactional account email uses HTTPS because Render blocks SMTP egress.
travelgo.mail.enabled=true
travelgo.mail.dispatch-enabled=true
travelgo.mail.transport=brevo-api
travelgo.mail.from=${TRAVELGO_MAIL_FROM:}
travelgo.mail.brevo-api-key=${BREVO_API_KEY:}
travelgo.mail.feedback.brevo-enabled=false
travelgo.mail.feedback.brevo-token=
travelgo.public-base-url=${TRAVELGO_PUBLIC_BASE_URL:}

# Private Supabase storage and a small Cloudmersive free-tier upload budget.
travelgo.documents.storage-backend=supabase
travelgo.upload-directory=/tmp/travelgo-document-fallback
travelgo.documents.max-file-bytes=3000000
travelgo.documents.max-image-pixels=8000000
spring.servlet.multipart.max-file-size=3000000B
spring.servlet.multipart.max-request-size=3500000B
travelgo.documents.supabase.project-url=${SUPABASE_PROJECT_URL:}
travelgo.documents.supabase.bucket=${SUPABASE_DOCUMENT_BUCKET:}
travelgo.documents.supabase.service-key=${SUPABASE_SERVICE_KEY:}
travelgo.documents.supabase.connect-timeout-ms=3000
travelgo.documents.supabase.request-timeout-ms=15000
travelgo.documents.scan.enabled=true
travelgo.documents.scan.backend=cloudmersive
travelgo.documents.scan.host=127.0.0.1
travelgo.documents.scan.port=3310
travelgo.documents.scan.connect-timeout-ms=2000
travelgo.documents.scan.read-timeout-ms=15000
travelgo.documents.scan.max-bytes=3000000
travelgo.documents.cloudmersive.api-key=${CLOUDMERSIVE_API_KEY:}
travelgo.documents.cloudmersive.connect-timeout-ms=2000
travelgo.documents.cloudmersive.request-timeout-ms=15000

# Shared authentication budgets and staff step-up protection are durable in Aiven MySQL.
travelgo.security.csp.enabled=true
travelgo.security.auth-abuse.enabled=true
travelgo.security.auth-abuse.store=jdbc
travelgo.security.auth-abuse.hmac-key=${TRAVELGO_AUTH_RATE_HMAC_KEY:}
travelgo.security.staff-mfa.enabled=true
travelgo.security.staff-mfa.staff-mandatory=true
travelgo.security.staff-mfa.encryption-key=${TRAVELGO_STAFF_MFA_ENCRYPTION_KEY:}

# Owner-requested one-time public catalogue recovery; no schema/account/financial writes.
travelgo.cloud-evaluation.public-catalogue-recovery=local-public-catalogue-20261108
travelgo.cloud-evaluation.paris-visibility-repair=correct-restored-paris-20261108
