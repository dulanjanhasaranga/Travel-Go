# One-time setup for an entirely empty Aiven defaultdb schema. This profile is not a website
# and exits after creating mapped tables, baseline roles/settings, one initial admin, and the
# durable authentication-guard row. Delete the Render initializer service after it succeeds.
spring.datasource.url=${TRAVELGO_DB_URL:}
spring.datasource.username=${TRAVELGO_DB_USERNAME:}
spring.datasource.password=${TRAVELGO_DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=create
spring.sql.init.mode=never
travelgo.data-initializer.enabled=true
travelgo.demo.enabled=false
travelgo.bootstrap.admin.email=${TRAVELGO_BOOTSTRAP_ADMIN_EMAIL:}
travelgo.bootstrap.admin.password=${TRAVELGO_BOOTSTRAP_ADMIN_PASSWORD:}
travelgo.bootstrap.admin.name=${TRAVELGO_BOOTSTRAP_ADMIN_NAME:Initial Administrator}

spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreUrl=file:/tmp/travelgo-aiven/truststore.p12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStoreType=PKCS12
spring.datasource.hikari.data-source-properties.trustCertificateKeyStorePassword=${TRAVELGO_DB_TRUSTSTORE_PASSWORD:}
spring.datasource.hikari.data-source-properties.fallbackToSystemTrustStore=false
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.main.web-application-type=none
logging.file.name=
logging.logback.rollingpolicy.file-name-pattern=

travelgo.cloud-evaluation.release-acceptance=${TRAVELGO_CLOUD_EVALUATION_ACCEPTANCE:}
travelgo.cloud-evaluation.schema-init=${TRAVELGO_CLOUD_EVALUATION_SCHEMA_INIT:}
travelgo.cloud-evaluation.init-confirmation=${TRAVELGO_CLOUD_EVALUATION_INIT_CONFIRM:}

travelgo.mail.enabled=false
travelgo.mail.dispatch-enabled=false
travelgo.payments.simulated=true
travelgo.stripe.enabled=false
travelgo.payhere.enabled=false
travelgo.auth.google.enabled=false
travelgo.catalogue.install=false
travelgo.catalogue.restore-original=false
travelgo.documents.storage-backend=filesystem
travelgo.upload-directory=/tmp/travelgo-schema-init-documents
travelgo.documents.scan.enabled=false
travelgo.security.auth-abuse.enabled=false
travelgo.security.auth-abuse.store=memory
travelgo.security.staff-mfa.enabled=false
