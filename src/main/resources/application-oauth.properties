# Enable only with: --spring.profiles.active=mysql,oauth --travelgo.auth.google.enabled=true
# Real credentials must come from the deployment environment, never source control.
spring.security.oauth2.client.registration.google.client-id=${TRAVELGO_GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${TRAVELGO_GOOGLE_CLIENT_SECRET}
