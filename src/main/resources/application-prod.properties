# Production expects a provisioned database schema and externally supplied secrets.
spring.datasource.url=${TRAVELGO_DB_URL}
spring.datasource.username=${TRAVELGO_DB_USERNAME}
spring.datasource.password=${TRAVELGO_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
# Bound pooled readiness acquisition/validation; this is not a whole-request deadline.
spring.datasource.hikari.connection-timeout=5000
spring.datasource.hikari.validation-timeout=2000
spring.sql.init.mode=never
travelgo.data-initializer.enabled=false
spring.jpa.open-in-view=true
spring.thymeleaf.cache=true
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=lax
travelgo.demo.enabled=false
travelgo.bookings.require-supplier-confirmation=true
travelgo.bookings.require-published-policy=true
travelgo.upload-directory=${TRAVELGO_UPLOAD_DIRECTORY}
server.address=127.0.0.1
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=30s
logging.file.name=${TRAVELGO_LOG_DIRECTORY:logs}/travelgo.log
logging.logback.rollingpolicy.file-name-pattern=${TRAVELGO_LOG_DIRECTORY:logs}/travelgo.%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=20MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=1GB
# Counts and configured integration flags remain behind /admin/operations authorization.
# /healthz returns only UP/DOWN, and checks the database plus private document directory.

# Production must explicitly enable the provisioned local scanner. No connection is made by the early guard.
travelgo.documents.scan.enabled=${TRAVELGO_DOCUMENT_SCAN_ENABLED:false}
travelgo.documents.scan.backend=${TRAVELGO_DOCUMENT_SCAN_BACKEND:clamd}
travelgo.documents.scan.host=${TRAVELGO_DOCUMENT_SCAN_HOST:127.0.0.1}
travelgo.documents.scan.port=${TRAVELGO_DOCUMENT_SCAN_PORT:3310}
travelgo.documents.scan.connect-timeout-ms=${TRAVELGO_DOCUMENT_SCAN_CONNECT_TIMEOUT_MS:2000}
# Bounds the complete post-connect send/read exchange, including stalled writes.
travelgo.documents.scan.read-timeout-ms=${TRAVELGO_DOCUMENT_SCAN_READ_TIMEOUT_MS:15000}
travelgo.documents.scan.max-bytes=${TRAVELGO_DOCUMENT_SCAN_MAX_BYTES:10485760}

# Production fails before datasource access unless these controls are configured.
travelgo.security.csp.enabled=${TRAVELGO_CSP_ENABLED:true}
travelgo.security.auth-abuse.enabled=true
travelgo.security.auth-abuse.store=${TRAVELGO_AUTH_RATE_STORE:jdbc}
travelgo.security.auth-abuse.hmac-key=${TRAVELGO_AUTH_RATE_HMAC_KEY:}
travelgo.security.staff-mfa.enabled=${TRAVELGO_STAFF_MFA_ENABLED:false}
travelgo.security.staff-mfa.staff-mandatory=true
travelgo.security.staff-mfa.encryption-key=${TRAVELGO_STAFF_MFA_ENCRYPTION_KEY:}
