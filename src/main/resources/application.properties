# ============================================
# TravelGO - Application Configuration
# ============================================

spring.application.name=TravelGO
spring.profiles.active=${SPRING_PROFILES_ACTIVE:mysql}
travelgo.demo.enabled=${TRAVELGO_DEMO_ENABLED:false}
# Existing databases are never seeded by an ordinary startup. Fresh installations opt in explicitly.
travelgo.data-initializer.enabled=${TRAVELGO_DATA_INITIALIZER_ENABLED:false}

# ---- Local secrets (gitignored — never committed) ----
# Create a file named local.properties in the project root and add:
#   TRAVELGO_DB_PASSWORD=your_actual_password
spring.config.import=optional:file:./local.properties

# ---- Database: MySQL ----
spring.datasource.url=${TRAVELGO_DB_URL:jdbc:mysql://localhost:3306/travelgo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TRAVELGO_DB_USERNAME:root}
spring.datasource.password=${TRAVELGO_DB_PASSWORD:}

# Optional first administrator for a brand-new, otherwise account-free database.
# Set both values outside source control; existing accounts are never changed.
travelgo.bootstrap.admin.email=${TRAVELGO_BOOTSTRAP_ADMIN_EMAIL:}
travelgo.bootstrap.admin.password=${TRAVELGO_BOOTSTRAP_ADMIN_PASSWORD:}
travelgo.bootstrap.admin.name=${TRAVELGO_BOOTSTRAP_ADMIN_NAME:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=validate
spring.sql.init.mode=never
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Server ----
# Port 8080 belongs to another project; TravelGO uses 8081.
server.port=8081
# Cookies are shared across ports on the same host. Keep this project isolated.
server.servlet.session.cookie.name=TRAVELGO_WORKSPACE_8081

# ---- File Upload ----
spring.servlet.multipart.max-file-size=${TRAVELGO_DOCUMENT_MAX_FILE_BYTES:10485760}B
# Leave bounded room for multipart form fields above the 10 MiB local file limit.
spring.servlet.multipart.max-request-size=${TRAVELGO_DOCUMENT_MAX_REQUEST_BYTES:11534336}B


# Transactional delivery is opt-in; configure SPRING_MAIL_* using environment variables.
travelgo.mail.enabled=${TRAVELGO_MAIL_ENABLED:false}
travelgo.mail.dispatch-enabled=${TRAVELGO_MAIL_DISPATCH_ENABLED:false}
travelgo.mail.account-retry-enabled=${TRAVELGO_MAIL_ACCOUNT_RETRY_ENABLED:true}
travelgo.mail.account-poll-delay-ms=${TRAVELGO_MAIL_ACCOUNT_POLL_DELAY_MS:1000}
travelgo.mail.from=${TRAVELGO_MAIL_FROM:no-reply@travelgo.example}
travelgo.mail.transport=${TRAVELGO_MAIL_TRANSPORT:smtp}
# Optional hosted HTTPS transport; this is a Brevo API key, not the SMTP password.
travelgo.mail.brevo-api-key=${BREVO_API_KEY:}
travelgo.public-base-url=${TRAVELGO_PUBLIC_BASE_URL:http://localhost:8081}
spring.mail.host=${SPRING_MAIL_HOST:}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.checkserveridentity=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# Optional private cloud documents. Default local and production storage stays filesystem.
# A separate hosted-evaluation release and provider acceptance are required before public use.
travelgo.documents.storage-backend=${TRAVELGO_DOCUMENT_STORAGE_BACKEND:filesystem}
travelgo.documents.max-file-bytes=${TRAVELGO_DOCUMENT_MAX_FILE_BYTES:10485760}
travelgo.documents.max-image-pixels=${TRAVELGO_DOCUMENT_MAX_IMAGE_PIXELS:25000000}
travelgo.documents.supabase.project-url=${SUPABASE_PROJECT_URL:}
travelgo.documents.supabase.bucket=${SUPABASE_DOCUMENT_BUCKET:}
travelgo.documents.supabase.service-key=${SUPABASE_SERVICE_KEY:}
travelgo.documents.supabase.connect-timeout-ms=${SUPABASE_CONNECT_TIMEOUT_MS:3000}
travelgo.documents.supabase.request-timeout-ms=${SUPABASE_REQUEST_TIMEOUT_MS:15000}
# Prepared scanner only; the separate cloud-evaluation profile requires every reviewed release setting.
travelgo.documents.cloudmersive.api-key=${CLOUDMERSIVE_API_KEY:}
travelgo.documents.cloudmersive.connect-timeout-ms=${CLOUDMERSIVE_CONNECT_TIMEOUT_MS:2000}
travelgo.documents.cloudmersive.request-timeout-ms=${CLOUDMERSIVE_REQUEST_TIMEOUT_MS:15000}

# ---- Stripe Configuration ----
travelgo.payments.simulated=${TRAVELGO_SIMULATED_PAYMENTS:true}
travelgo.stripe.enabled=${TRAVELGO_STRIPE_ENABLED:false}
travelgo.stripe.public-key=${STRIPE_PUBLIC_KEY:}
travelgo.stripe.secret-key=${STRIPE_SECRET_KEY:}
travelgo.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
# Select the provider environment explicitly; keys must match. This never enables checkout.
travelgo.stripe.mode=${TRAVELGO_STRIPE_MODE:test}

# PayHere is prepared independently; opt-in settings never enable real transactions by default.
travelgo.payhere.enabled=${TRAVELGO_PAYHERE_ENABLED:false}
travelgo.payhere.mode=${TRAVELGO_PAYHERE_MODE:test}
travelgo.payhere.merchant-id=${PAYHERE_MERCHANT_ID:}
travelgo.payhere.merchant-secret=${PAYHERE_MERCHANT_SECRET:}
travelgo.payhere.app-id=${PAYHERE_APP_ID:}
travelgo.payhere.app-secret=${PAYHERE_APP_SECRET:}
# Existing prices are USD. Confirm merchant support; this is not a currency conversion.
travelgo.payhere.usd-approved=${TRAVELGO_PAYHERE_USD_APPROVED:false}

travelgo.auth.google.enabled=${TRAVELGO_GOOGLE_OAUTH_ENABLED:false}

# Local demos remain compatible; the guarded production launcher requires external supplier evidence.
travelgo.bookings.require-supplier-confirmation=${TRAVELGO_REQUIRE_SUPPLIER_CONFIRMATION:false}

# Optional dated display estimates only. USD remains the booking and settlement currency.
travelgo.pricing.lkr-estimates.enabled=${TRAVELGO_LKR_ESTIMATES_ENABLED:false}
travelgo.pricing.lkr-estimates.rate=${TRAVELGO_LKR_PER_USD:}
travelgo.pricing.lkr-estimates.as-of=${TRAVELGO_LKR_RATE_AS_OF:}
travelgo.pricing.lkr-estimates.source=${TRAVELGO_LKR_RATE_SOURCE:}
travelgo.pricing.lkr-estimates.maximum-age-days=${TRAVELGO_LKR_RATE_MAX_AGE_DAYS:7}

# Optional recipient delivery feedback adapter. Requires owner-selected Brevo and reviewed migration.
travelgo.mail.feedback.brevo-enabled=${TRAVELGO_MAIL_FEEDBACK_BREVO_ENABLED:false}
travelgo.mail.feedback.brevo-token=${TRAVELGO_MAIL_FEEDBACK_BREVO_TOKEN:}

# Browser script policy is enforced. Staff MFA/shared budgets need reviewed schema and private keys.
travelgo.security.csp.enabled=${TRAVELGO_CSP_ENABLED:true}
travelgo.security.auth-abuse.store=${TRAVELGO_AUTH_RATE_STORE:memory}
travelgo.security.auth-abuse.hmac-key=${TRAVELGO_AUTH_RATE_HMAC_KEY:}
travelgo.security.staff-mfa.enabled=${TRAVELGO_STAFF_MFA_ENABLED:false}
travelgo.security.staff-mfa.staff-mandatory=true
travelgo.security.staff-mfa.encryption-key=${TRAVELGO_STAFF_MFA_ENCRYPTION_KEY:}
