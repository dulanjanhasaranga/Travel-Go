# ============================================
# TravelGO - Application Configuration
# ============================================

spring.application.name=TravelGO
spring.profiles.active=mysql,demo
travelgo.demo.enabled=true

# ---- Local secrets (gitignored — never committed) ----
# Create a file named local.properties in the project root and add:
#   DB_PASSWORD=your_actual_password
spring.config.import=optional:file:./local.properties

# ---- Database: MySQL ----
spring.datasource.url=${TRAVELGO_DB_URL:jdbc:mysql://localhost:3306/travelgo?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${TRAVELGO_DB_USERNAME:${DB_USERNAME:root}}
spring.datasource.password=${TRAVELGO_DB_PASSWORD:${DB_PASSWORD:}}

# Optional first administrator for a brand-new, otherwise account-free database.
# Set both values outside source control; existing accounts are never changed.
travelgo.bootstrap.admin.email=${TRAVELGO_BOOTSTRAP_ADMIN_EMAIL:}
travelgo.bootstrap.admin.password=${TRAVELGO_BOOTSTRAP_ADMIN_PASSWORD:}
travelgo.bootstrap.admin.name=${TRAVELGO_BOOTSTRAP_ADMIN_NAME:}

# ---- JPA / Hibernate ----
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Server ----
server.port=8080

# ---- File Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


spring.jpa.show-sql=false
spring.jpa.open-in-view=true

# ---- Thymeleaf ----
spring.thymeleaf.cache=false

# ---- Server ----
server.port=8080

# ---- File Upload ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB


# Transactional delivery is opt-in; configure SPRING_MAIL_* using environment variables.
travelgo.mail.enabled=${TRAVELGO_MAIL_ENABLED:false}
travelgo.mail.from=${TRAVELGO_MAIL_FROM:no-reply@travelgo.example}
travelgo.public-base-url=${TRAVELGO_PUBLIC_BASE_URL:http://localhost:8080}
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# ---- Stripe Configuration ----
travelgo.stripe.public-key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}
travelgo.stripe.secret-key=${STRIPE_SECRET_KEY:sk_test_placeholder}
travelgo.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:whsec_placeholder}

spring.security.oauth2.client.registration.google.client-id=DUMMY_CLIENT_ID
spring.security.oauth2.client.registration.google.client-secret=DUMMY_SECRET
